<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz Live</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d3341;
      color: white;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 480px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 72px; height: 72px;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      padding: 3px;
      margin-bottom: 16px;
    }

    .waiting-emoji {
      font-size: 72px;
      animation: bounce 1.6s ease-in-out infinite;
      margin-bottom: 16px;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-18px); }
    }
    .waiting-title { font-size: 28px; font-weight: 900; margin-bottom: 10px; }
    .waiting-sub   { font-size: 16px; opacity: 0.75; }
    .dots::after {
      content: '';
      animation: dots 1.8s infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }

    .q-header {
      background: rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 22px 20px;
      width: 100%;
      margin-bottom: 18px;
    }
    .q-emoji { font-size: 52px; margin-bottom: 10px; }
    .q-text  { font-size: 19px; font-weight: 700; line-height: 1.35; }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }
    .answer-btn {
      border: none;
      border-radius: 14px;
      padding: 18px 12px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      transition: transform 0.12s, filter 0.12s;
      min-height: 76px;
      line-height: 1.3;
    }
    .answer-btn:active  { transform: scale(0.94); }
    .answer-btn.used    { opacity: 0.45; pointer-events: none; }
    .answer-btn.chosen  { outline: 4px solid white; opacity: 1 !important; }
    .answer-btn[data-i="0"] { background: #E21B3C; }
    .answer-btn[data-i="1"] { background: #1368CE; }
    .answer-btn[data-i="2"] { background: #D89E00; }
    .answer-btn[data-i="3"] { background: #26890C; }
    .answer-icon { font-size: 22px; flex-shrink: 0; }

    .big-emoji  { font-size: 80px; margin-bottom: 18px; }
    .big-title  { font-size: 28px; font-weight: 900; margin-bottom: 10px; }
    .big-sub    { font-size: 15px; opacity: 0.75; }

    .results-q {
      font-size: 16px;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 18px;
      line-height: 1.3;
    }
    .res-bars { width: 100%; margin-bottom: 18px; }
    .res-row  { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .res-chip {
      width: 30px; height: 30px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800;
      flex-shrink: 0;
    }
    .res-chip[data-i="0"] { background: #E21B3C; }
    .res-chip[data-i="1"] { background: #1368CE; }
    .res-chip[data-i="2"] { background: #D89E00; }
    .res-chip[data-i="3"] { background: #26890C; }
    .res-bar-wrap {
      flex: 1;
      background: rgba(255,255,255,0.18);
      border-radius: 6px;
      height: 26px;
      overflow: hidden;
    }
    .res-bar {
      height: 100%;
      border-radius: 6px;
      width: 0%;
      transition: width 1.1s cubic-bezier(0.4,0,0.2,1);
    }
    .res-bar[data-i="0"] { background: #E21B3C; }
    .res-bar[data-i="1"] { background: #1368CE; }
    .res-bar[data-i="2"] { background: #D89E00; }
    .res-bar[data-i="3"] { background: #26890C; }
    .res-pct { width: 38px; text-align: right; font-size: 14px; font-weight: 800; flex-shrink: 0; }

    .fin-emoji {
      font-size: 80px;
      margin-bottom: 18px;
      animation: pop 0.5s ease-out;
    }
    @keyframes pop {
      from { transform: scale(0.4) rotate(-15deg); opacity: 0; }
      to   { transform: scale(1) rotate(0); opacity: 1; }
    }
  </style>
</head>
<body>

<div id="s-waiting" class="screen active">
  <img src="/logo.png" class="logo" alt="Logo">
  <div class="waiting-emoji">🎯</div>
  <div class="waiting-title">Sei connesso!</div>
  <div class="waiting-sub">Aspetta la prima domanda<span class="dots"></span></div>
</div>

<div id="s-question" class="screen">
  <div class="q-header">
    <div class="q-emoji" id="q-emoji">❓</div>
    <div class="q-text" id="q-text"></div>
  </div>
  <div class="answers" id="answers-grid"></div>
</div>

<div id="s-voted" class="screen">
  <div class="big-emoji">✅</div>
  <div class="big-title">Risposta inviata!</div>
  <div class="big-sub">Attendi i risultati<span class="dots"></span></div>
</div>

<div id="s-results" class="screen">
  <div class="results-q" id="res-q-text"></div>
  <div class="res-bars" id="res-bars"></div>
  <div class="big-sub">Prossima domanda in arrivo<span class="dots"></span></div>
</div>

<div id="s-finished" class="screen">
  <img src="/logo.png" class="logo" alt="Logo">
  <div class="fin-emoji">🏆</div>
  <div class="big-title">Grazie!</div>
  <div class="big-sub">Hai completato il quiz.<br>Ottimo lavoro! 🎉</div>
</div>

<script>
const ICONS = ['▲', '◆', '●', '■'];
const socket = io();
let hasVoted = false;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

socket.on('state', ({ phase, question, votes, totalVotes }) => {
  if (phase === 'waiting') {
    hasVoted = false;
    show('s-waiting');
  } else if (phase === 'voting') {
    hasVoted = false;
    if (question) {
      document.getElementById('q-emoji').textContent = question.emoji;
      document.getElementById('q-text').textContent = question.text;
      buildAnswers(question.answers);
    }
    show('s-question');
  } else if (phase === 'closed') {
    show('s-voted');
  } else if (phase === 'results') {
    if (question && votes) {
      document.getElementById('res-q-text').textContent = question.emoji + '  ' + question.text;
      buildResults(question.answers, votes, totalVotes);
    }
    show('s-results');
  } else if (phase === 'finished') {
    show('s-finished');
  }
});

socket.on('voted', () => {
  hasVoted = true;
  show('s-voted');
});

function buildAnswers(answers) {
  const grid = document.getElementById('answers-grid');
  grid.innerHTML = '';
  answers.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.setAttribute('data-i', i);
    btn.innerHTML = `<span class="answer-icon">${ICONS[i]}</span><span>${text}</span>`;
    btn.addEventListener('click', () => {
      if (hasVoted) return;
      socket.emit('vote', { index: i });
      document.querySelectorAll('.answer-btn').forEach((b, j) => {
        b.classList.add('used');
        if (j === i) b.classList.add('chosen');
      });
    });
    grid.appendChild(btn);
  });
}

function buildResults(answers, votes, totalVotes) {
  const container = document.getElementById('res-bars');
  container.innerHTML = '';
  const total = totalVotes || 1;
  answers.forEach((text, i) => {
    const count = votes[i] || 0;
    const pct = totalVotes > 0 ? Math.round((count / total) * 100) : 0;
    const row = document.createElement('div');
    row.className = 'res-row';
    row.innerHTML = `
      <div class="res-chip" data-i="${i}">${ICONS[i]}</div>
      <div class="res-bar-wrap">
        <div class="res-bar" data-i="${i}" id="pb-${i}"></div>
      </div>
      <div class="res-pct" id="pp-${i}">0%</div>`;
    container.appendChild(row);
  });
  requestAnimationFrame(() => {
    answers.forEach((_, i) => {
      const count = votes[i] || 0;
      const pct = totalVotes > 0 ? Math.round((count / total) * 100) : 0;
      setTimeout(() => {
        const bar = document.getElementById(`pb-${i}`);
        const lbl = document.getElementById(`pp-${i}`);
        if (bar) bar.style.width = pct + '%';
        if (lbl) lbl.textContent = pct + '%';
      }, 100 + i * 160);
    });
  });
}
</script>
</body>
</html>
